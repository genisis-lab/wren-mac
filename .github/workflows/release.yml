name: Release
# Every tested main build is an update; version tags and manual runs are also supported.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wren-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check update signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo '::error::Set the SPARKLE_PRIVATE_KEY repository secret before publishing updates.'; exit 1; }
      - name: Version and build number
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^[[:space:]]*MARKETING_VERSION: //p' project.yml)
          if [ "$REF_TYPE" = tag ]; then version=${REF_NAME#v}; fi
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Use a numeric version such as v0.2.0.'; exit 1; }
          # Run IDs are unique and increase across workflows; retries retain the same release.
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          tag="build-$GITHUB_RUN_ID"
          if [ "$REF_TYPE" = tag ]; then tag=$REF_NAME; fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Test the mail engine
        run: swift test
      - name: Generate project and build universal app
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
          ./bundle.sh MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          codesign --verify --deep --strict --verbose=2 build/Wren.app
          lipo -verify_arch arm64 x86_64 build/Wren.app/Contents/MacOS/Wren
      - name: Sign archive and feed with Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sparkle_tools=$(find build/DerivedData -path '*/artifacts/sparkle/Sparkle/bin/sign_update' -print -quit)
          test -x "$sparkle_tools"
          archive="Wren-$VERSION-$BUILD.zip"
          ditto -c -k --keepParent build/Wren.app "$archive"
          signature=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_tools" --ed-key-file - "$archive")
          [[ $signature == sparkle:edSignature=* ]] || { echo '::error::Sparkle did not sign the archive'; exit 1; }
          export ARCHIVE="$archive" SIGNATURE="$signature"
          python3 scripts/write-appcast.py
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle_tools" --ed-key-file - appcast.xml
          # Verify both signatures with the public key embedded in the built app.
          python3 scripts/verify-update.py appcast.xml "$archive" build/Wren.app/Contents/Info.plist "$sparkle_tools"
      - name: Publish release after all checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="Wren-$VERSION-$BUILD.zip"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Wren $VERSION (build $BUILD)" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "$archive" appcast.xml --clobber
          # A retry of an older run must not replace a newer update as latest.
          latest_build=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.assets[].name' 2>/dev/null | sed -nE 's/^Wren-[0-9.]+-([0-9]+)\.zip$/\1/p' || true)
          latest=true
          if [ -n "$latest_build" ] && [ "$latest_build" -gt "$BUILD" ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
