name: CI
on:
  push:
    # Branches only: a version tag is the release workflow's.
    branches: ['**']
  pull_request:
defaults:
  run:
    # -eo pipefail, so a failure piped through tee still fails the step.
    shell: bash
jobs:
  build:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Test the engine
        run: |
          swift build --build-tests 2>&1 | tee engine.log
          swift test --skip-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the bundled PGP engine
        working-directory: pgp
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          git diff --exit-code -- ../Sources/Wren/Resources/pgp.js
      - name: Test app credential storage
        run: scripts/test-app-security.sh
      - name: Make the Xcode project from project.yml
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
      - name: Build the app, widget and Share extension
        run: |
          status=0
          ./bundle.sh 2>&1 | tee app.log || status=$?
          # Compiler and build-tool errors and warnings also show as annotations on the pull request.
          { grep -hE '^/[^:]+:[0-9]+:[0-9]+: (error|warning): ' engine.log app.log | sort -u \
              | sed -E "s#^$GITHUB_WORKSPACE/##; s#^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)\$#::\\4 file=\\1,line=\\2,col=\\3::\\5#"
            grep -hE '^([a-z]+: )?(error|warning): ' engine.log app.log | sort -u | sed -E 's#^([a-z]+: )?(error|warning): (.*)$#::\2::\1\3#'; } || true
          test -d build/Wren.app/Contents/PlugIns/WrenWidget.appex
          test -d build/Wren.app/Contents/PlugIns/WrenShare.appex
          test -d build/Wren.app/Contents/Frameworks/Sparkle.framework
          exit $status
      # So the project can be opened in Xcode without XcodeGen. A push from here doesn't start another run.
      - name: Commit the project when project.yml changed it
        if: github.event_name == 'push'
        run: |
          git add -A Wren.xcodeproj
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Regenerate Wren.xcodeproj from project.yml"
          git push origin "HEAD:$GITHUB_REF_NAME" || echo "::warning::Wren.xcodeproj is out of date; the branch moved before it could be pushed"
