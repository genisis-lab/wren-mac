name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: |
          status=0
          { swift build --build-tests && swift test --skip-build; } 2>&1 | tee build.log || status=$?
          # Compiler errors and warnings also show as annotations on the pull request.
          grep -E '^/[^:]+:[0-9]+:[0-9]+: (error|warning): ' build.log | sort -u | sed -E "s#^$GITHUB_WORKSPACE/##; s#^([^:]+):([0-9]+):([0-9]+): (error|warning): (.*)\$#::\\4 file=\\1,line=\\2,col=\\3::\\5#" || true
          # The app target only exists on macOS; make sure it was built, not just the engine.
          test -x "$(swift build --show-bin-path)/Wren"
          exit $status
